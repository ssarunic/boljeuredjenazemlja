name: Translation and documentation gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the SDK, the CLI, the MCP server and the mock server
        run: |
          python -m pip install --upgrade pip
          pip install -e ./api -e "./cli[dev]" -e "./mcp[dev]"
          pip install -r mock-server/requirements.txt

      - name: SDK tests
        working-directory: api
        run: pytest -q --no-cov

      - name: MCP server tests
        working-directory: mcp
        run: pytest -q --no-cov

      - name: Translation coverage gate
        working-directory: cli
        run: pytest tests/test_i18n_coverage.py -q --no-cov

      - name: Terminology gate
        working-directory: cli
        run: pytest tests/test_terminology.py -q --no-cov

      - name: Output field names gate
        working-directory: cli
        run: pytest tests/test_output_keys.py -q --no-cov

      - name: Documentation coverage gate
        working-directory: cli
        run: pytest tests/test_docs_coverage.py -q --no-cov

      - name: Release consistency gate
        working-directory: cli
        run: pytest tests/test_release_consistency.py -q --no-cov
